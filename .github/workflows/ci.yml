name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push replaces the run of the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run recettes:verifier
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
