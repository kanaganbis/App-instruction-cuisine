name: Publication

# Publishes the app on GitHub Pages once the repository variable
# GOOGLE_API_KEY exists (see README, « Mise en route »). The Drive folder comes
# from .env.production, unless a DRIVE_FOLDER variable overrides it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.GOOGLE_API_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER }}
        run: |
          if [ -n "$DRIVE_FOLDER" ]; then export VITE_DRIVE_FOLDER="$DRIVE_FOLDER"; fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
